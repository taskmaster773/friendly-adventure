<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about:blank · URL cloaker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0e0f12;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
            color: #e3e4e8;
        }

        .card {
            background: #181a1f;
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            max-width: 620px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
            transition: transform 0.2s ease;
        }

        h1 {
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        h1 span {
            background: #2d2f36;
            font-size: 0.9rem;
            font-weight: 400;
            padding: 0.25rem 0.9rem;
            border-radius: 60px;
            color: #a2a6b5;
            letter-spacing: 0.3px;
            border: 1px solid #3a3d46;
        }

        .sub {
            color: #8b8f9e;
            font-size: 0.98rem;
            margin-bottom: 2rem;
            border-left: 3px solid #2e6aff;
            padding-left: 1rem;
            font-weight: 350;
            line-height: 1.4;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .url-field {
            display: flex;
            align-items: center;
            background: #0d0e11;
            border-radius: 16px;
            border: 1px solid #2b2e36;
            transition: border 0.2s, box-shadow 0.2s;
            padding: 0.2rem 0.2rem 0.2rem 1rem;
        }

        .url-field:focus-within {
            border-color: #3b6eff;
            box-shadow: 0 0 0 3px rgba(59, 110, 255, 0.2);
        }

        .url-field input {
            background: transparent;
            border: none;
            padding: 1rem 0.5rem 1rem 0;
            font-size: 1rem;
            width: 100%;
            color: #f0f2f8;
            outline: none;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            letter-spacing: 0.2px;
        }

        .url-field input::placeholder {
            color: #505560;
            font-weight: 350;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        .url-field .protocol-badge {
            color: #6c7280;
            font-size: 0.9rem;
            font-family: 'SF Mono', monospace;
            padding-right: 0.3rem;
            user-select: none;
            opacity: 0.7;
        }

        .actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 1rem 1.5rem;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            font-weight: 550;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #2a2d36;
            color: #ecedf2;
            border: 1px solid #3b3f4a;
            letter-spacing: 0.2px;
        }

        .btn-primary {
            background: #2e6aff;
            border: 1px solid #4d7eff;
            color: white;
            box-shadow: 0 8px 18px -6px #2e6aff80;
        }

        .btn-primary:hover {
            background: #1f5af0;
            border-color: #6b93ff;
            transform: scale(1.01);
        }

        .btn-primary:active {
            transform: scale(0.99);
            box-shadow: 0 4px 10px -4px #2e6aff;
        }

        .btn-secondary:hover {
            background: #323641;
            border-color: #505561;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        .btn-icon {
            font-size: 1.2rem;
            line-height: 1;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.3));
        }

        .status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.8rem 1rem;
            background: #111317;
            border-radius: 14px;
            border-left: 4px solid #2e6aff;
            color: #b6bac8;
            word-break: break-all;
            font-family: 'SF Mono', monospace;
            transition: 0.15s;
        }

        .status .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2e6aff;
            flex-shrink: 0;
            box-shadow: 0 0 10px #2e6aff;
        }

        .status.error {
            border-left-color: #ff4d6d;
            color: #ffb3c1;
        }

        .status.error .indicator {
            background: #ff4d6d;
            box-shadow: 0 0 10px #ff4d6d;
        }

        .status.success {
            border-left-color: #00c48c;
            color: #b3f0d9;
        }

        .status.success .indicator {
            background: #00c48c;
            box-shadow: 0 0 10px #00c48c;
        }

        .hint {
            display: flex;
            justify-content: flex-end;
            font-size: 0.8rem;
            color: #5f6472;
            margin-top: 0.8rem;
            gap: 0.8rem;
        }

        .hint kbd {
            background: #22252c;
            border-radius: 6px;
            padding: 0.15rem 0.5rem;
            font-family: 'SF Mono', monospace;
            font-size: 0.7rem;
            border: 1px solid #3b3f48;
            color: #b0b5c2;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            ⚡ about:blank
            <span>cloaker</span>
        </h1>
        <div class="sub">
            Enter any URL — we open it in a blank tab that looks like <strong>about:blank</strong>.
        </div>

        <div class="input-group">
            <div class="url-field">
                <span class="protocol-badge">https://</span>
                <input type="text" id="urlInput" placeholder="example.com" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="cloakBtn">
                <span class="btn-icon">🕶️</span> Open as about:blank
            </button>
            <button class="btn btn-secondary" id="clearBtn">
                <span class="btn-icon">✕</span> Clear
            </button>
        </div>

        <div class="status" id="statusMessage">
            <span class="indicator"></span>
            <span id="statusText">Ready — type a URL and hit the button.</span>
        </div>

        <div class="hint">
            <span><kbd>Enter</kbd> to cloak</span>
            <span>popup blocker may apply</span>
        </div>
    </div>

    <script>
        (function() {
            const urlInput = document.getElementById('urlInput');
            const cloakBtn = document.getElementById('cloakBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statusMessage = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');

            // Helper: update status UI
            function setStatus(message, type = 'info') {
                statusText.textContent = message;
                statusMessage.classList.remove('error', 'success');
                if (type === 'error') statusMessage.classList.add('error');
                if (type === 'success') statusMessage.classList.add('success');
            }

            // Reset to default info status
            function resetStatus() {
                setStatus('Ready — type a URL and hit the button.', 'info');
            }

            // Normalize the input: add https:// if missing, trim whitespace
            function normalizeUrl(raw) {
                let trimmed = raw.trim();
                if (!trimmed) return '';

                // if it already has a protocol (http, https, ftp, etc.), keep it
                // otherwise prepend https://
                const hasProtocol = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(trimmed);
                if (!hasProtocol) {
                    trimmed = 'https://' + trimmed;
                }
                return trimmed;
            }

            // Validate URL using the browser's URL constructor
            function isValidHttpUrl(string) {
                try {
                    const url = new URL(string);
                    return url.protocol === 'http:' || url.protocol === 'https:';
                } catch {
                    return false;
                }
            }

            // Core function: open a new window with about:blank then inject an iframe or redirect
            function cloakUrl() {
                const rawInput = urlInput.value;
                const normalized = normalizeUrl(rawInput);

                if (!normalized) {
                    setStatus('Please enter a URL.', 'error');
                    urlInput.focus();
                    return;
                }

                // Basic validation (must be http/https after normalization)
                if (!isValidHttpUrl(normalized)) {
                    setStatus('Invalid URL — make sure it looks like example.com or https://example.com', 'error');
                    urlInput.focus();
                    return;
                }

                // Attempt to open a blank window
                let blankWindow = null;
                try {
                    // Open a new window with a blank document.
                    // The 'noopener' flag is omitted because we need window.opener for some techniques,
                    // but we will be careful.
                    blankWindow = window.open('about:blank', '_blank');
                } catch (e) {
                    setStatus('Popup blocked — please allow popups for this site.', 'error');
                    return;
                }

                if (!blankWindow) {
                    setStatus('Popup blocked — please allow popups for this site.', 'error');
                    return;
                }

                // At this point we have a blank window.
                // We'll write a minimal HTML into it that loads the target URL inside an iframe
                // while keeping the address bar as "about:blank".
                // This is a classic "about:blank cloaking" technique.
                try {
                    // Build a document that fills the viewport with an iframe.
                    // The address bar will remain about:blank (or the opener's origin in some browsers).
                    const targetUrl = normalized; // already includes protocol

                    // Escape the URL for safe embedding in the HTML string.
                    // We'll use JSON.stringify to get a properly escaped string.
                    const safeUrlForJs = JSON.stringify(targetUrl);

                    const htmlContent = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about:blank</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe {
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>
    <iframe src="${targetUrl}" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
    <script>
        // Prevent the iframe from breaking out (optional)
        // Also, keep the parent window from being navigated away.
        (function() {
            // Hide the fact that we're an iframe from simple detection?
            // Not necessary, but we can try to keep things clean.
            try {
                // If the iframe tries to top-navigate, block it.
                window.addEventListener('beforeunload', function(e) {
                    // just a simple guard
                });
            } catch(e) {}
        })();
    <\/script>
</body>
</html>`.trim();

                    // Write the HTML to the new window
                    blankWindow.document.open();
                    blankWindow.document.write(htmlContent);
                    blankWindow.document.close();

                    // Optionally, set the title of the new window (though about:blank usually shows the URL)
                    blankWindow.document.title = 'about:blank';

                    setStatus(`Opened "${normalized}" in about:blank tab.`, 'success');
                } catch (err) {
                    console.error(err);
                    // If writing fails, fallback: try to redirect (but that would change the URL)
                    // We'll just show an error.
                    setStatus('Could not inject content — trying to navigate directly? (URL will be visible)', 'error');
                    // optional fallback: blankWindow.location.href = normalized;  // but that breaks cloaking
                    // Better to close the blank window to avoid orphan.
                    try { blankWindow.close(); } catch (e) {}
                }
            }

            // Clear input and reset status
            function clearInput() {
                urlInput.value = '';
                resetStatus();
                urlInput.focus();
            }

            // Event listeners
            cloakBtn.addEventListener('click', cloakUrl);

            clearBtn.addEventListener('click', clearInput);

            // Enter key on input
            urlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    cloakUrl();
                }
            });

            // Focus on input when page loads
            window.addEventListener('load', () => {
                urlInput.focus();
            });

            // Optional: simple debounce to clear status if user types (avoid stale errors)
            let typingTimer;
            urlInput.addEventListener('input', () => {
                // if the status is an error, reset to neutral after user types
                if (statusMessage.classList.contains('error') || statusMessage.classList.contains('success')) {
                    clearTimeout(typingTimer);
                    typingTimer = setTimeout(() => {
                        resetStatus();
                    }, 600);
                }
            });

            // Handle popup window closed events? not needed.
        })();
    </script>
</body>
</html>
