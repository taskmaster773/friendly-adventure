<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GUST Proxy Browser</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
        height: 100%;
        width: 100%;
        background: #0a0a0a;
        color: #fff;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* ---- TOP TOOLBAR ---- */
    .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #111;
        border-bottom: 1px solid #222;
        flex-shrink: 0;
        z-index: 100;
    }

    .nav-btn {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        color: #ccc;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        transition: .15s;
        flex-shrink: 0;
    }

    .nav-btn:hover {
        background: #2a2a2a;
        color: #fff;
        border-color: #444;
    }

    .nav-btn:active {
        transform: scale(.94);
    }

    .nav-btn:disabled {
        opacity: .35;
        cursor: not-allowed;
    }

    .url-display {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        background: #0d0d0d;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        padding: 0 14px;
        height: 38px;
        overflow: hidden;
        min-width: 0;
    }

    .url-display i {
        color: #555;
        font-size: 13px;
        flex-shrink: 0;
    }

    .url-display input {
        flex: 1;
        background: transparent;
        border: none;
        color: #fff;
        font-size: 13px;
        outline: none;
        min-width: 0;
        font-family: 'JetBrains Mono', monospace;
    }

    .url-display input::placeholder {
        color: #555;
    }

    .url-display .go-btn {
        background: #4fc3f7;
        border: none;
        color: #000;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        transition: .15s;
        flex-shrink: 0;
    }

    .url-display .go-btn:hover {
        background: #7ad4f9;
        transform: scale(1.05);
    }

    /* ---- STATUS BAR ---- */
    .status {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 16px;
        background: #0d0d0d;
        border-bottom: 1px solid #1a1a1a;
        font-size: 11px;
        color: #666;
        flex-shrink: 0;
        height: 26px;
    }

    .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #44ff88;
        animation: pulse 2s infinite;
        flex-shrink: 0;
    }

    .status-dot.loading {
        background: #ffd54f;
    }

    .status-dot.error {
        background: #ff5252;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .4; }
    }

    /* ---- MAIN (sidebar + viewport) ---- */
    .main {
        flex: 1;
        display: flex;
        overflow: hidden;
        min-height: 0;
    }

    /* ---- SIDEBAR ---- */
    .sidebar {
        width: 220px;
        flex-shrink: 0;
        background: #0d0d0d;
        border-right: 1px solid #1a1a1a;
        overflow-y: auto;
        padding: 12px 8px;
    }

    .sidebar::-webkit-scrollbar {
        width: 6px;
    }

    .sidebar::-webkit-scrollbar-thumb {
        background: #222;
        border-radius: 3px;
    }

    .sidebar-title {
        font-size: 10px;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 700;
        padding: 8px 10px 6px 10px;
    }

    .link-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: .12s;
        color: #ccc;
        font-size: 13px;
    }

    .link-item:hover {
        background: #1a1a1a;
        color: #fff;
    }

    .link-item.active {
        background: #1a2a3a;
        color: #4fc3f7;
    }

    .link-item i {
        width: 16px;
        text-align: center;
        font-size: 13px;
        color: #666;
        flex-shrink: 0;
    }

    .link-item:hover i,
    .link-item.active i {
        color: inherit;
    }

    /* ---- VIEWPORT ---- */
    .viewport {
        flex: 1;
        position: relative;
        background: #000;
        overflow: hidden;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    .viewport iframe {
        flex: 1;
        width: 100%;
        border: none;
        background: #fff;
        display: block;
        min-height: 0;
    }

    /* ---- WELCOME ---- */
    .welcome {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px;
        text-align: center;
        background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 70%);
        z-index: 5;
    }

    .welcome.hidden {
        display: none;
    }

    .welcome i.big {
        font-size: 56px;
        color: #4fc3f7;
        margin-bottom: 18px;
        opacity: .85;
    }

    .welcome h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -.5px;
        margin-bottom: 8px;
    }

    .welcome p {
        color: #888;
        font-size: 13px;
        max-width: 420px;
        line-height: 1.6;
    }

    /* ---- LOADING BAR ---- */
    .loading-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 2px;
        background: #4fc3f7;
        width: 0%;
        transition: width .3s ease;
        z-index: 10;
        pointer-events: none;
    }

    .loading-bar.active {
        width: 80%;
    }

    .loading-bar.done {
        width: 100%;
        opacity: 0;
        transition: width .2s, opacity .3s .2s;
    }

    /* ---- OVERLAY (GUST loading / errors) ---- */
    .gust-overlay {
        position: absolute;
        inset: 0;
        background: rgba(10, 12, 16, .92);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        flex-direction: column;
        gap: 10px;
        font-size: 14px;
        color: #b8c4d0;
    }

    .gust-overlay.hidden {
        display: none;
    }

    .gust-overlay .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, .1);
        border-top-color: #9de5ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .gust-overlay-error {
        width: 80px;
        height: 80px;
        background: rgba(255, 149, 149, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .gust-overlay-error i {
        font-size: 36px;
        color: #ff9595;
    }

    /* ---- MOBILE ---- */
    @media (max-width: 768px) {
        .sidebar {
            display: none;
        }
        .welcome h1 {
            font-size: 20px;
        }
        .toolbar {
            padding: 8px 10px;
            gap: 6px;
        }
        .nav-btn {
            width: 32px;
            height: 32px;
            font-size: 12px;
        }
        .url-display {
            height: 34px;
            padding: 0 10px;
        }
        .url-display input {
            font-size: 12px;
        }
    }
</style>
</head>
<body>

<!-- ============ TOOLBAR ============ -->
<div class="toolbar">
    <button class="nav-btn" id="back" title="Back" disabled><i class="fas fa-arrow-left"></i></button>
    <button class="nav-btn" id="fwd" title="Forward" disabled><i class="fas fa-arrow-right"></i></button>
    <button class="nav-btn" id="reload" title="Reload"><i class="fas fa-rotate-right"></i></button>
    <button class="nav-btn" id="home" title="Home"><i class="fas fa-house"></i></button>

    <div class="url-display">
        <i class="fas fa-shield-halved"></i>
        <input type="text" id="url" placeholder="Search or enter address" autocomplete="off" spellcheck="false">
        <button class="go-btn" id="go"><i class="fas fa-arrow-right"></i></button>
    </div>
</div>

<!-- ============ STATUS BAR ============ -->
<div class="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Ready</span>
</div>

<!-- ============ MAIN ============ -->
<div class="main">
    <aside class="sidebar" id="sidebar">
        <!-- populated by JS -->
    </aside>

    <div class="viewport">
        <div class="loading-bar" id="loadingBar"></div>

        <!-- GUST overlay for loading + errors -->
        <div class="gust-overlay hidden" id="overlay">
            <div class="spinner" id="overlaySpinner"></div>
            <div id="overlayText">Loading...</div>
        </div>

        <!-- Welcome screen -->
        <div class="welcome" id="welcome">
            <i class="fas fa-shield-halved big"></i>
            <h1>GUST Proxy Browser</h1>
            <p>Select a shortcut from the sidebar, or type a URL in the address bar. All traffic is routed through a secure WISP tunnel with libcurl.js.</p>
        </div>

        <!-- The actual proxy iframe -->
        <iframe id="frame"
            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-pointer-lock allow-downloads"
            allow="clipboard-read; clipboard-write; fullscreen; autoplay; camera; microphone; gamepad">
        </iframe>
    </div>
</div>

<!-- ============ WISP / libcurl.js loader ============ -->
<script src="https://cdn.jsdelivr.net/npm/libcurl.js@latest/libcurl_full.js" defer
    onload="window._libcurlReady=true;"
    onerror="(function(){ const reason='The libcurl.js script could not be fetched from cdn.jsdelivr.net. The CDN may be unreachable or blocked.'; window._libcurlLoadError=reason; console.error('[GUST] libcurl.js failed to load:', reason); })();"
></script>

<!-- ============ Sidebar shortcuts (customizable) ============ -->

<!-- ============ GUST proxy engine (truncated to essentials) ============ -->
<script>
// NOTE: The full GUST proxy engine is huge. To keep this file manageable,
// the essential proxy logic is included below. For the complete engine,
// copy the entire <script> block from the original GUST file between
// the (function () { and })(); markers and paste it here.
//
// The UI shell above (toolbar, sidebar, status bar) hooks into:
//   - #url        -> urlInput
//   - #go         -> go()
//   - #back/#fwd  -> history
//   - #reload     -> reload
//   - #home       -> showNewTab
//   - #frame      -> the proxy iframe
//   - #overlay    -> loading / error overlay
//   - #statusDot / #statusText -> status
//
// Below is a minimal working proxy stub using libcurl.js + WISP.
// Replace this with the full GUST engine for the complete feature set.

(function () {
    'use strict';

    const $ = id => document.getElementById(id);
    const frame = $('frame');
    const urlInput = $('url');
    const overlay = $('overlay');
    const overlayText = $('overlayText');
    const statusDot = $('statusDot');
    const statusText = $('statusText');
    const loadingBar = $('loadingBar');
    const sidebar = $('sidebar');
    const welcome = $('welcome');

    // ---- Sidebar ----
    function renderSidebar() {
        sidebar.innerHTML = '<div class="sidebar-title">Shortcuts</div>';
        PROXY_LINKS.forEach((item, idx) => {
            const el = document.createElement('div');
            el.className = 'link-item';
            el.dataset.idx = idx;
            el.innerHTML = `<i class="${item.icon}"></i><span>${item.name}</span>`;
            el.addEventListener('click', () => loadLink(idx));
            sidebar.appendChild(el);
        });
    }

    // ---- History ----
    let history_ = [];
    let historyIdx = -1;

    function updateNav() {
        $('back').disabled = historyIdx <= 0;
        $('fwd').disabled = historyIdx >= history_.length - 1;
    }

    // ---- Status ----
    function setStatus(text, type) {
        statusText.textContent = text;
        statusDot.className = 'status-dot' + (type ? ' ' + type : '');
    }

    function showOverlay(msg) {
        overlayText.textContent = msg;
        overlay.classList.remove('hidden');
    }

    function hideOverlay() {
        overlay.classList.add('hidden');
    }

    // ---- Proxy engine (minimal) ----
    let curl = null;
    let WISP = 'wss://wisp.mercurywork.shop/';

    async function initProxy() {
        if (typeof libcurl === 'undefined') {
            setStatus('libcurl.js not loaded — check your connection', 'error');
            showOverlay('libcurl.js failed to load');
            return;
        }
        try {
            await libcurl.load_wasm();
            libcurl.set_websocket(WISP);
            curl = new libcurl.HTTPSession();
            curl.set_connections(6, 6, 6);
            setStatus('Ready');
            hideOverlay();
            console.log('[GUST] Proxy ready');
        } catch (e) {
            setStatus('Proxy init failed: ' + e.message, 'error');
            showOverlay('Proxy init failed: ' + e.message);
        }
    }

    async function fetchViaProxy(url) {
        if (!curl) throw new Error('Proxy not ready');
        const resp = await curl.fetch(url, { method: 'GET' });
        const buf = await resp.arrayBuffer();
        const mime = resp.headers.get('content-type') || 'text/html';
        return { buf, mime, status: resp.status };
    }

    // ---- Navigation ----
    async function go(url, push) {
        if (push === undefined) push = true;
        if (!url) return;

        // Normalise
        if (!/^https?:\/\//i.test(url) && !url.startsWith('gust://')) {
            if (url.includes('.') && !url.includes(' ')) {
                url = 'https://' + url;
            } else {
                url = 'https://search.brave.com/search?q=' + encodeURIComponent(url);
            }
        }

        welcome.classList.add('hidden');
        urlInput.value = url;
        setStatus('Loading…', 'loading');
        loadingBar.className = 'loading-bar active';
        showOverlay('Loading…');

        if (push) {
            history_ = history_.slice(0, historyIdx + 1);
            history_.push(url);
            historyIdx = history_.length - 1;
            updateNav();
        }

        document.querySelectorAll('.link-item').forEach(el => el.classList.remove('active'));

        try {
            const { buf, mime, status } = await fetchViaProxy(url);
            const html = new TextDecoder().decode(buf);

            // Minimal HTML rewriting: inject proxy script
            const doc = new DOMParser().parseFromString(html, 'text/html');
            // Remove CSP meta
            doc.querySelectorAll('meta[http-equiv]').forEach(m => {
                const v = (m.getAttribute('http-equiv') || '').toLowerCase();
                if (v.includes('content-security') || v.includes('x-frame')) m.remove();
            });
            // Set base
            let base = doc.querySelector('base');
            if (!base) {
                base = doc.createElement('base');
                doc.head.prepend(base);
            }
            base.href = url;

            // Inject a minimal proxy script
            const proxyScript = doc.createElement('script');
            proxyScript.textContent = `(function(){
                document.addEventListener('click', function(e){
                    var a = e.target.closest('a');
                    if (!a) return;
                    var href = a.getAttribute('href');
                    if (!href || /^(#|javascript:)/i.test(href)) return;
                    e.preventDefault();
                    parent.postMessage({t:'n', u: new URL(href, ${JSON.stringify(url)}).href}, '*');
                }, true);
            })();`;
            doc.head.insertBefore(proxyScript, doc.head.firstChild);

            const finalHtml = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
            const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
            const blobUrl = URL.createObjectURL(blob);

            frame.src = blobUrl;

            frame.onload = () => {
                hideOverlay();
                loadingBar.className = 'loading-bar done';
                setTimeout(() => { loadingBar.className = 'loading-bar'; }, 500);
                setStatus('Loaded', '');
                frame.onload = null;
            };

            setStatus(`Loaded (${status})`, '');
        } catch (e) {
            console.error('[GUST] Load error:', e);
            hideOverlay();
            loadingBar.className = 'loading-bar';
            setStatus('Error: ' + e.message, 'error');
            overlayText.textContent = 'Failed to load: ' + e.message;
            overlay.classList.remove('hidden');
        }
    }

    // ---- Load shortcut ----
    function loadLink(idx) {
        const item = PROXY_LINKS[idx];
        if (!item) return;
        document.querySelectorAll('.link-item').forEach(el => {
            el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
        });
        go(item.url, true);
    }

    // ---- Toolbar buttons ----
    $('go').addEventListener('click', () => go(urlInput.value.trim()));
    urlInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            e.preventDefault();
            go(urlInput.value.trim());
        }
    });

    $('back').addEventListener('click', () => {
        if (historyIdx > 0) {
            historyIdx--;
            updateNav();
            go(history_[historyIdx], false);
        }
    });

    $('fwd').addEventListener('click', () => {
        if (historyIdx < history_.length - 1) {
            historyIdx++;
            updateNav();
            go(history_[historyIdx], false);
        }
    });

    $('reload').addEventListener('click', () => {
        if (historyIdx >= 0) go(history_[historyIdx], false);
    });

    $('home').addEventListener('click', () => {
        welcome.classList.remove('hidden');
        frame.src = 'about:blank';
        urlInput.value = '';
        setStatus('Ready');
        loadingBar.className = 'loading-bar';
        document.querySelectorAll('.link-item').forEach(el => el.classList.remove('active'));
    });

    // ---- postMessage from proxied pages ----
    window.addEventListener('message', e => {
        if (!e.data || !e.data.t) return;
        if (e.data.t === 'n' && e.data.u) {
            go(e.data.u, true);
        }
    });

    // ---- Init ----
    renderSidebar();
    updateNav();
    setStatus('Initializing…');
    showOverlay('Initializing proxy…');

    // Wait for libcurl.js to be ready
    const waitForLibcurl = setInterval(() => {
        if (typeof libcurl !== 'undefined' && libcurl.load_wasm) {
            clearInterval(waitForLibcurl);
            initProxy();
        }
    }, 100);

    // Timeout after 30s
    setTimeout(() => {
        clearInterval(waitForLibcurl);
        if (!curl) {
            setStatus('libcurl.js timed out', 'error');
            showOverlay('libcurl.js failed to load — check your connection');
        }
    }, 30000);

})();
</script>

</body>
